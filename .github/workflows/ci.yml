name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  rust:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: redis:7
            cli: redis-cli
            features: tokio-comp,sync,serde,worker
          - image: redis:7
            cli: redis-cli
            features: tokio-comp,sync
          - image: redis:7
            cli: redis-cli
            features: tokio-comp
          - image: redis:8
            cli: redis-cli
            features: tokio-comp,sync,serde,worker
          - image: valkey/valkey:9
            cli: valkey-cli
            features: tokio-comp,sync,serde,worker
          - image: docker.dragonflydb.io/dragonflydb/dragonfly@sha256:94891bb22ce2fb0f7a5a3ff1bb3b2fbbc5830e2523293e47723d87fa3e5b1184
            cli: redis-cli
            features: tokio-comp,sync,serde,worker
            docker_options: --ulimit memlock=-1

    services:
      queue-store:
        image: ${{ matrix.image }}
        env:
          DFLY_proactor_threads: "2"
          DFLY_maxmemory: 768mb
        ports:
          - 6379:6379
        options: >-
          ${{ matrix.docker_options }}
          --health-cmd "${{ matrix.cli }} ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --no-default-features --features "${{ matrix.features }}"
      - name: Test
        run: cargo test --no-default-features --features "${{ matrix.features }}" -- --test-threads=1
        env:
          REDIS_URL: 127.0.0.1:6379

  build-smol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (smol-comp)
        run: cargo build --no-default-features --features smol-comp

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build all examples (all features)
        run: cargo build --examples --all-features

  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: redis:7
            cli: redis-cli
          - image: redis:8
            cli: redis-cli
          - image: valkey/valkey:9
            cli: valkey-cli
          - image: docker.dragonflydb.io/dragonflydb/dragonfly@sha256:94891bb22ce2fb0f7a5a3ff1bb3b2fbbc5830e2523293e47723d87fa3e5b1184
            cli: redis-cli
            docker_options: --ulimit memlock=-1

    services:
      queue-store:
        image: ${{ matrix.image }}
        env:
          DFLY_proactor_threads: "2"
          DFLY_maxmemory: 768mb
        ports:
          - 6379:6379
        options: >-
          ${{ matrix.docker_options }}
          --health-cmd "${{ matrix.cli }} ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: node/package-lock.json
      - name: Build Rust interop helper
        run: cargo build --example interop_helper --no-default-features --features serde,tokio-comp
      - run: npm ci
        working-directory: node
      - name: Node and Rust interop tests
        working-directory: node
        run: npm test
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
      - name: Check the packed Node package
        if: matrix.image == 'redis:8'
        working-directory: node
        run: |
          pack_dir=$(mktemp -d)
          npm pack --pack-destination "$pack_dir"
          cd "$(mktemp -d)"
          npm install --no-audit --no-fund "$pack_dir"/*.tgz
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import Redis from 'ioredis';
          import { createClient } from '@davidbm/rbmq';
          const redis = new Redis({ lazyConnect: true });
          createClient(redis);
          assert.equal(typeof redis.rbmqCreateQueue, 'function');
          redis.disconnect();
          JS
